services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pricehud:${POSTGRES_PASSWORD}@db:5432/pricehud
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pricehud
      POSTGRES_USER: pricehud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pricehud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricehud -d pricehud"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pricehud-postgres:
